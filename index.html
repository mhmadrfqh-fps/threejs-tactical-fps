<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tactical FPS - make.fun bounty</title>
<style>
  body { margin:0; overflow:hidden; background:#0a0a0a; font-family: monospace; }
  #crosshair { position:fixed; top:50%; left:50%; width:20px; height:20px; transform:translate(-50%,-50%); pointer-events:none; z-index:10; }
  #crosshair:before, #crosshair:after { content:''; position:absolute; background:#00ff88; }
  #crosshair:before { width:2px; height:20px; left:9px; top:0; } #crosshair:after { width:20px; height:2px; top:9px; left:0; }
  #ui { position:fixed; top:10px; left:10px; color:#00ff88; z-index:10; background:rgba(0,0,0,0.7); padding:10px; border:1px solid #00ff88; }
  #tactical { position:fixed; top:10px; left:10px; width:150px; height:150px; border:1px solid #00ff88; background:rgba(0,255,136,0.1); margin-top:80px; }
  #hud { position:fixed; bottom:10px; left:10px; color:#fff; z-index:10; }
  #start { position:fixed; inset:0; background:rgba(0,0,0,0.9); display:flex; align-items:center; justify-content:center; flex-direction:column; color:#00ff88; z-index:20; cursor:pointer; }
  #start h1 { font-size:48px; margin:0; } #start p { opacity:0.7; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="start"><h1>TACTICAL FPS</h1><p>Click to Lock & Play | WASD Move | Mouse Aim | Click Shoot</p><p style="font-size:12px">Built for make.fun/threejs-fps-02 by @muhammad-rofiq</p></div>
<div id="crosshair"></div>
<div id="ui">SCORE: <span id="score">0</span> | ENEMIES: <span id="enemies">3</span></div>
<canvas id="tactical"></canvas>
<div id="hud">AMMO: ∞ | [R] Reload Tactical View</div>

<script type="module">
import * as THREE from 'three';

let scene, camera, renderer, controls, raycaster;
let enemies=[], score=0, keys={};
let yaw=0, pitch=0;

init();

function init(){
  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x111111, 0, 80);
  camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
  camera.position.set(0,1.6,5);
  
  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);

  // lights
  scene.add(new THREE.HemisphereLight(0xffffff, 0x222222, 1.2));
  const dir = new THREE.DirectionalLight(0x00ff88, 0.8); dir.position.set(5,10,5); scene.add(dir);

  // floor
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(100,100), new THREE.MeshStandardMaterial({color:0x1a1a1a, roughness:0.8}));
  floor.rotation.x=-Math.PI/2; scene.add(floor);
  // grid tactical
  const grid = new THREE.GridHelper(100, 20, 0x00ff88, 0x222222); scene.add(grid);
  
  // walls - tactical cover
  for(let i=0;i<12;i++){
    const box = new THREE.Mesh(new THREE.BoxGeometry(2+Math.random()*3,3,0.5), new THREE.MeshStandardMaterial({color:0x333333}));
    box.position.set((Math.random()-0.5)*40,1.5,(Math.random()-0.5)*40); scene.add(box);
  }
  // enemies
  spawnEnemies();

  raycaster = new THREE.Raycaster();
  
  window.addEventListener('keydown', e=>keys[e.code]=true);
  window.addEventListener('keyup', e=>keys[e.code]=false);
  window.addEventListener('mousemove', e=>{
    if(document.pointerLockElement!==renderer.domElement) return;
    yaw -= e.movementX*0.002;
    pitch -= e.movementY*0.002;
    pitch = Math.max(-1.4, Math.min(1.4, pitch));
  });
  renderer.domElement.addEventListener('click', ()=>{
    if(document.pointerLockElement!==renderer.domElement){ renderer.domElement.requestPointerLock(); document.getElementById('start').style.display='none'; return; }
    shoot();
  });
  window.addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
  animate();
}

function spawnEnemies(){
  for(let i=0;i<3;i++){
    const mesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.4,1,4,8), new THREE.MeshStandardMaterial({color:0xff3333, emissive:0x330000}));
    mesh.position.set((Math.random()-0.5)*30,1,(Math.random()-0.5)*30); if(mesh.position.length()<8) mesh.position.multiplyScalar(2);
    mesh.userData.hp=100; scene.add(mesh); enemies.push(mesh);
  }
}

function shoot(){
  raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
  const hits = raycaster.intersectObjects(enemies);
  if(hits.length){
    const e = hits[0].object;
    e.userData.hp-=50;
    e.material.color.set(0xffff00);
    setTimeout(()=>e.material.color.set(0xff3333),100);
    if(e.userData.hp<=0){ scene.remove(e); enemies = enemies.filter(x=>x!==e); score+=100; document.getElementById('score').textContent=score; document.getElementById('enemies').textContent=enemies.length; if(enemies.length===0) setTimeout(spawnEnemies,1500); }
  }
  // muzzle flash
  const flash = new THREE.PointLight(0x00ff88,5,5); flash.position.copy(camera.position); scene.add(flash); setTimeout(()=>scene.remove(flash),50);
}

function animate(){
  requestAnimationFrame(animate);
  const speed=0.12;
  const dir = new THREE.Vector3();
  if(keys['KeyW']) dir.z-=speed; if(keys['KeyS']) dir.z+=speed; if(keys['KeyA']) dir.x-=speed; if(keys['KeyD']) dir.x+=speed;
  dir.applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
  camera.position.add(dir);
  camera.rotation.order='YXZ'; camera.rotation.y=yaw; camera.rotation.x=pitch;
  // tactical map update
  drawTactical();
  renderer.render(scene,camera);
}

function drawTactical(){
  const c = document.getElementById('tactical'); const ctx=c.getContext('2d'); c.width=150; c.height=150;
  ctx.fillStyle='rgba(0,0,0,0.8)'; ctx.fillRect(0,0,150,150);
  ctx.strokeStyle='#00ff88'; ctx.strokeRect(0,0,150,150);
  // player
  ctx.fillStyle='#00ff88'; ctx.beginPath(); ctx.arc(75+camera.position.x*2,75+camera.position.z*2,4,0,Math.PI*2); ctx.fill();
  // enemies
  ctx.fillStyle='#ff3333'; enemies.forEach(e=>{ ctx.beginPath(); ctx.arc(75+e.position.x*2,75+e.position.z*2,3,0,Math.PI*2); ctx.fill(); });
}
</script>
</body>
</html>
